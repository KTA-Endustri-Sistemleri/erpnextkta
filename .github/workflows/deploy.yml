name: Deploy Production Release

on:
  schedule:
    # Her Pazar gecesi TSİ 23:00'te çalışır (UTC 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or branch to deploy (leave empty for latest release)'
        required: false
        default: ''
      force:
        description: 'Force deploy even if already on the target tag'
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Bench
    runs-on: [self-hosted, production]

    steps:
      - name: Check for New Release
        id: check_version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          cd /home/erpnext/frappe-bench/apps/erpnextkta
          git fetch --tags --force origin

          if [ -n "$INPUT_TAG" ]; then
            TARGET_REF="$INPUT_TAG"
          else
            TARGET_REF=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$TARGET_REF" ]; then
              TARGET_REF="main"
            fi
          fi

          CURRENT_REF=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD)

          echo "Current version on bench : $CURRENT_REF"
          echo "Target version to deploy : $TARGET_REF"

          if [ "$CURRENT_REF" = "$TARGET_REF" ] && [ "$FORCE" != "true" ]; then
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "Bench is already up-to-date with $TARGET_REF. Skipping deployment."
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "target_ref=$TARGET_REF" >> $GITHUB_OUTPUT
          fi

      - name: Update erpnextkta to Target
        if: steps.check_version.outputs.should_deploy == 'true'
        env:
          TARGET: ${{ steps.check_version.outputs.target_ref }}
        run: |
          cd /home/erpnext/frappe-bench/apps/erpnextkta

          if [ -n "$(git status --porcelain)" ]; then
            echo "UYARI: Sunucuda yerel degisiklikler tespit edildi! Diff loglaniyor ve stash'e aliniyor..."
            git status -s || true
            git diff HEAD || true
            git -c user.name="deploy-bot" -c user.email="deploy@localhost" \
              stash push -u -m "pre-deploy-${TARGET}-$(date +%Y%m%d_%H%M%S)" || true
            git reset --hard
          fi

          echo "Checking out $TARGET..."
          if git show-ref --verify --quiet "refs/tags/$TARGET"; then
            git checkout -f "refs/tags/$TARGET"
          elif git fetch origin "$TARGET" 2>/dev/null; then
            git checkout -f -B "$TARGET" FETCH_HEAD
          else
            git checkout -f "$TARGET"
          fi

      - name: Install Python Dependencies
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          /home/erpnext/frappe-bench/env/bin/pip install -q -e /home/erpnext/frappe-bench/apps/erpnextkta

      - name: Enable Maintenance Mode
        id: maintenance
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          cd /home/erpnext/frappe-bench
          bench --site erpnext.kta-endustri.com.tr set-maintenance-mode on

      - name: Run Bench Migrate
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          cd /home/erpnext/frappe-bench
          bench --site erpnext.kta-endustri.com.tr migrate

      - name: Build Frontend Assets
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          cd /home/erpnext/frappe-bench
          bench build --app erpnextkta --production

      - name: Clear Caches
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          cd /home/erpnext/frappe-bench
          bench --site erpnext.kta-endustri.com.tr clear-cache
          bench --site erpnext.kta-endustri.com.tr clear-website-cache

      - name: Restart Bench Services
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          cd /home/erpnext/frappe-bench
          bench restart

      - name: Disable Maintenance Mode
        if: always() && steps.maintenance.conclusion == 'success'
        run: |
          cd /home/erpnext/frappe-bench
          bench --site erpnext.kta-endustri.com.tr set-maintenance-mode off
