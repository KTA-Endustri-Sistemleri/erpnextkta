name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # PR’larda numara var; push(main) için yoksa tekil anahtar kullanır.
  group: main-erpnextkta-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    services:
      redis-cache:
        image: redis:alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      redis-queue:
        image: redis:alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --health-start-period=20s

    steps:
      - name: Bootstrap Container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y sudo curl git build-essential pkg-config libmysqlclient-dev python3-dev python3-pip python3-setuptools python3-venv cron tzdata
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          dpkg-reconfigure --frontend noninteractive tzdata
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g yarn
          pip3 install frappe-bench
          useradd -m -s /bin/bash frappe
          echo "frappe ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v4
        with:
          set-safe-directory: 'true'

      - name: Fix permissions
        run: |
          chown -R frappe:frappe .

      # (İsteğe bağlı) Test dosyası yoksa job fail etmesin
      - name: Find tests (optional)
        run: |
          echo "Finding tests (non-blocking)"
          grep -rn "def test" || echo "No tests found"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'


      - name: Cache pip
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Setup bench and DB
        working-directory: /home/frappe
        run: |
          rm -rf /home/frappe/frappe-bench
          sudo -H -u frappe bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --verbose /home/frappe/frappe-bench
          # DB hazır olana kadar bekle
          for i in {1..30}; do
            mariadb -h mariadb -P 3306 -uroot -proot -e "SELECT 1" && break
            echo "Waiting for MariaDB..."
            sleep 2
          done
          mariadb -h mariadb -P 3306 -uroot -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb -h mariadb -P 3306 -uroot -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app to test site
        working-directory: /home/frappe/frappe-bench
        env:
          CI: 'Yes'
        run: |
          sudo -H -u frappe bench get-app payments --branch version-15
          sudo -H -u frappe bench get-app hrms --branch version-15
          sudo -H -u frappe bench get-app erpnext https://github.com/frappe/erpnext --branch version-15
          sudo -H -u frappe bench get-app https://github.com/Framras/trtaxoffices.git --branch version-15
          sudo -H -u frappe bench get-app https://github.com/Framras/trtcmb.git --branch version-15
          sudo -H -u frappe bench get-app https://github.com/Framras/trebelge.git --branch version-15
          sudo -H -u frappe bench get-app erpnextkta $GITHUB_WORKSPACE
          sudo -H -u frappe bench setup requirements --dev
          sudo -H -u frappe ./env/bin/pip install --force-reinstall 'setuptools<81'
          sudo -H -u frappe ./env/bin/pip install tzdata
          sudo -H -u frappe bench set-config -g db_host mariadb
          sudo -H -u frappe bench set-config -g redis_cache redis://redis-cache:6379
          sudo -H -u frappe bench set-config -g redis_queue redis://redis-queue:6379
          sudo -H -u frappe bench set-config -g redis_socketio redis://redis-cache:6379
          # Yapılandırmayı doğrulamak için yazdır
          cat sites/common_site_config.json
          sudo -H -u frappe bench new-site --db-root-password root --admin-password admin test_site
          sudo -H -u frappe bench --site test_site install-app payments
          sudo -H -u frappe bench --site test_site install-app hrms
          sudo -H -u frappe bench --site test_site install-app erpnext
          sudo -H -u frappe bench --site test_site install-app trtaxoffices
          sudo -H -u frappe bench --site test_site install-app trtcmb
          sudo -H -u frappe bench --site test_site install-app trebelge
          sudo -H -u frappe bench --site test_site install-app erpnextkta
          sudo -H -u frappe bench --site test_site set-config allow_tests true
          sudo -H -u frappe bench build

      - name: Seed Infrastructure
        working-directory: /home/frappe/frappe-bench
        run: |
          sudo -H -u frappe bench --site test_site execute erpnextkta.tests.test_utils.before_tests

      - name: Run Tests
        working-directory: /home/frappe/frappe-bench
        run: |
          export PATH=$PATH:/home/frappe/.local/bin
          sudo -E -u frappe bench --site test_site run-tests --app erpnextkta