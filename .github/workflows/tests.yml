name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'

concurrency:
  # PR’larda numara var; push(main) için yoksa tekil anahtar kullanır.
  group: main-erpnextkta-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kta-endustri-sistemleri/frappe-ci-base:v15
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      redis-cache:
        image: redis:alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      redis-queue:
        image: redis:alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --health-start-period=20s

    steps:
      - name: Checkout erpnextkta
        uses: actions/checkout@v4
        with:
          set-safe-directory: 'true'

      - name: Fix permissions
        run: |
          chown -R frappe:frappe .
          mkdir -p /github/home/.cache /home/frappe/.cache
          chown -R frappe:frappe /github/home/.cache /home/frappe/.cache || true
          sudo -H -u frappe git config --global --add safe.directory '*'

      - name: Setup Site & Install Test Apps
        working-directory: /home/frappe/frappe-bench
        env:
          CI: 'Yes'
        run: |
          # MariaDB bağlantısı hazır olana kadar bekle
          for i in {1..60}; do
            mariadb -h mariadb -P 3306 -uroot -proot -e "SELECT 1" && break
            echo "Waiting for MariaDB..."
            sleep 2
          done
          mariadb -h mariadb -P 3306 -uroot -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb -h mariadb -P 3306 -uroot -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

          # Private kta_system_utils ve yerel erpnextkta reposunu bağla
          sudo -H -u frappe bench get-app https://${{ secrets.KTA_SYSTEM_UTILS_PAT }}@github.com/KTA-Endustri-Sistemleri/kta_system_utils.git --branch version-15
          sudo -H -u frappe bench get-app erpnextkta $GITHUB_WORKSPACE

          sudo -H -u frappe bench set-config -g db_host mariadb
          sudo -H -u frappe bench set-config -g redis_cache redis://redis-cache:6379
          sudo -H -u frappe bench set-config -g redis_queue redis://redis-queue:6379
          sudo -H -u frappe bench set-config -g redis_socketio redis://redis-cache:6379

          sudo -H -u frappe bench new-site --db-root-password root --admin-password admin test_site \
            --install-app payments \
            --install-app hrms \
            --install-app erpnext \
            --install-app trtaxoffices \
            --install-app trtcmb \
            --install-app trebelge \
            --install-app kta_system_utils \
            --install-app erpnextkta

          sudo -H -u frappe bench --site test_site set-config allow_tests true

      - name: Build erpnextkta Frontend
        working-directory: /home/frappe/frappe-bench
        run: |
          sudo -H -u frappe bench build --app erpnextkta --production

      - name: Seed Infrastructure
        working-directory: /home/frappe/frappe-bench
        run: |
          sudo -H -u frappe bench --site test_site execute erpnextkta.tests.test_utils.before_tests

      - name: Run Tests
        working-directory: /home/frappe/frappe-bench
        run: |
          export PATH=$PATH:/home/frappe/.local/bin
          sudo -E -u frappe bench --site test_site run-tests --app erpnextkta
