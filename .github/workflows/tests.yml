name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # PR’larda numara var; push(main) için yoksa tekil anahtar kullanır.
  group: main-erpnextkta-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13001:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11001:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 33066:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --health-start-period=20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (İsteğe bağlı) Test dosyası yoksa job fail etmesin
      - name: Find tests (optional)
        run: |
          echo "Finding tests (non-blocking)"
          grep -rn "def test" || echo "No tests found"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Install Yarn
        run: npm i -g yarn

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client redis-tools cron

      - name: Setup bench and DB
        run: |
          # Detect non-privileged user and their home directory
          RUN_USR=$(id -u ubuntu >/dev/null 2>&1 && echo "ubuntu" || echo "$USER")
          FRA_HOME=$(getent passwd $RUN_USR | cut -d: -f6)
          echo "RUN_USR=$RUN_USR" >> $GITHUB_ENV
          echo "FRA_HOME=$FRA_HOME" >> $GITHUB_ENV
          
          # Install bench as the simulation user
          sudo -u $RUN_USR pip install --user frappe-bench --break-system-packages
          
          # Identify the bin directory
          BIN_DIR=$(sudo -u $RUN_USR python3 -m site --user-base)/bin
          echo "BIN_DIR=$BIN_DIR" >> $GITHUB_ENV
          
          # Initialize bench as non-root user with PATH included for uv and redis-tools
          if [ ! -d $FRA_HOME/frappe-bench ]; then
            sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" $FRA_HOME/frappe-bench
          fi
          
          # DB ready check (mariadb can run as root)
          for i in {1..30}; do
            mariadb -h 127.0.0.1 -P 33066 -uroot -proot -e "SELECT 1" && break
            echo "Waiting for MariaDB..."
            sleep 2
          done
          mariadb -h 127.0.0.1 -P 33066 -uroot -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb -h 127.0.0.1 -P 33066 -uroot -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app to test site
        env:
          CI: 'Yes'
        run: |
          cd $FRA_HOME/frappe-bench
          [ -d apps/payments ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench get-app payments
          [ -d apps/hrms ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench get-app hrms --branch version-15
          [ -d apps/erpnext ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench get-app erpnext https://github.com/frappe/erpnext --branch version-15
          [ -d apps/trtaxoffices ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench get-app https://github.com/Framras/trtaxoffices.git --branch version-15
          [ -d apps/trtcmb ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench get-app https://github.com/Framras/trtcmb.git --branch version-15
          [ -d apps/trebelge ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench get-app https://github.com/Framras/trebelge.git --branch version-15
          [ -d apps/erpnextkta ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench get-app erpnextkta $GITHUB_WORKSPACE
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench setup requirements --dev
          sudo ./env/bin/pip install --force-reinstall 'setuptools==80.9.0'
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench set-config -g db_host 127.0.0.1
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench set-config -g db_port 33066
          [ -d sites/test_site ] || sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench new-site --db-root-password root --admin-password admin test_site
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site install-app payments
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site install-app hrms
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site install-app erpnext
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site install-app trtaxoffices
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site install-app trtcmb
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site install-app trebelge
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site install-app erpnextkta
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench set-config allow_tests true
      - name: Debug List Files
        run: |
          ls -R $FRA_HOME/frappe-bench/apps/erpnextkta/erpnextkta

      - name: Seed Infrastructure
        run: |
          cd $FRA_HOME/frappe-bench
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site execute erpnextkta.tests.test_utils.before_tests

      - name: Run Tests
        run: |
          cd $FRA_HOME/frappe-bench
          sudo -u $RUN_USR env "PATH=$BIN_DIR:$PATH" $BIN_DIR/bench --site test_site run-tests --app erpnextkta